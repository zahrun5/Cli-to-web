<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLI-to-Web Terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1b26; color: #c0caf5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100vh; max-height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    /* ── Login ── */
    #login-screen { display: flex; align-items: center; justify-content: center; height: 100vh; }
    .login-box { background: #24283b; border: 1px solid #3b4261; border-radius: 12px; padding: 2rem; width: 360px; }
    .login-box h1 { font-size: 1.4rem; margin-bottom: 0.5rem; color: #7aa2f7; }
    .login-box p { font-size: 0.85rem; color: #565f89; margin-bottom: 1.5rem; }
    .login-box input { width: 100%; padding: 0.6rem 0.8rem; background: #1a1b26; border: 1px solid #3b4261; border-radius: 6px; color: #c0caf5; font-size: 0.9rem; margin-bottom: 0.8rem; outline: none; }
    .login-box input:focus { border-color: #7aa2f7; }
    .login-box button { width: 100%; padding: 0.6rem; background: #7aa2f7; color: #1a1b26; border: none; border-radius: 6px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
    .login-box button:hover { background: #89b4fa; }
    .login-error { color: #f7768e; font-size: 0.8rem; margin-bottom: 0.5rem; display: none; }

    /* ── Dashboard ── */
    #dashboard { display: none; flex-direction: column; height: 100vh; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 0.8rem 1.2rem; background: #24283b; border-bottom: 1px solid #3b4261; }
    .topbar h2 { font-size: 1rem; color: #7aa2f7; }
    .topbar button { background: none; border: 1px solid #3b4261; color: #565f89; padding: 0.3rem 0.8rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
    .topbar button:hover { color: #c0caf5; border-color: #565f89; }

    /* ── Agent List ── */
    #agent-list-view { flex: 1; padding: 1.5rem; overflow-y: auto; }
    #agent-list-view h3 { color: #565f89; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 1rem; }
    .agent-card { background: #24283b; border: 1px solid #3b4261; border-radius: 8px; padding: 1rem 1.2rem; margin-bottom: 0.6rem; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: border-color 0.15s; }
    .agent-card:hover { border-color: #7aa2f7; }
    .agent-info { display: flex; align-items: center; gap: 0.8rem; }
    .agent-dot { width: 8px; height: 8px; border-radius: 50%; background: #9ece6a; }
    .agent-name { font-weight: 600; font-size: 0.95rem; }
    .agent-id { color: #565f89; font-size: 0.75rem; font-family: monospace; }
    .agent-meta { color: #565f89; font-size: 0.8rem; }
    .no-agents { color: #565f89; text-align: center; padding: 3rem; }

    /* ── Terminal ── */
    #terminal-view { display: none; flex: 1; flex-direction: column; }
    .terminal-topbar { display: flex; align-items: center; gap: 0.8rem; padding: 0.5rem 1rem; background: #24283b; border-bottom: 1px solid #3b4261; }
    .terminal-topbar button { background: none; border: 1px solid #3b4261; color: #c0caf5; padding: 0.25rem 0.6rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
    .terminal-topbar button:hover { border-color: #7aa2f7; color: #7aa2f7; }
    .terminal-topbar span { font-family: monospace; font-size: 0.85rem; color: #9ece6a; }
    #terminal-container { flex: 1 1 auto; padding: 4px; min-height: 0; overflow: hidden; }

    /* ── Key Toolbar ── */
    #key-toolbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      gap: 6px;
      padding: 6px 8px;
      background: #24283b;
      border-top: 1px solid #3b4261;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      flex-shrink: 0;
      scrollbar-width: none;
      z-index: 100;
      transition: transform 0.15s ease-out;
    }
    #key-toolbar::-webkit-scrollbar { display: none; }
    #key-toolbar button {
      flex-shrink: 0;
      min-width: 42px;
      padding: 0.5rem 0.7rem;
      background: #1a1b26;
      border: 1px solid #3b4261;
      color: #c0caf5;
      border-radius: 6px;
      font-size: 0.85rem;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #key-toolbar button:active { background: #33467c; }
    #key-toolbar button.active {
      background: #7aa2f7;
      color: #1a1b26;
      border-color: #7aa2f7;
    }
    #key-toolbar .divider {
      width: 1px;
      flex-shrink: 0;
      background: #3b4261;
      margin: 2px 2px;
    }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div id="login-screen">
    <div class="login-box">
      <h1>🖥 CLI-to-Web</h1>
      <p>Terminal akses jarak jauh</p>
      <div id="login-error" class="login-error"></div>
      <input type="text" id="username" placeholder="Username" autocomplete="username">
      <input type="password" id="password" placeholder="Password" autocomplete="current-password">
      <button id="login-btn" onclick="doLogin()">Login</button>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard">
    <div class="topbar">
      <h2>🖥 CLI-to-Web</h2>
      <div style="display:flex;gap:0.5rem;">
        <button onclick="refreshAgents()">↻ Refresh</button>
        <button onclick="doLogout()">Logout</button>
      </div>
    </div>

    <!-- Agent List -->
    <div id="agent-list-view">
      <h3>Online Agents</h3>
      <div id="agent-list"></div>
    </div>

    <!-- Terminal -->
    <div id="terminal-view">
      <div class="terminal-topbar">
        <button onclick="backToList()">← Back</button>
        <span id="terminal-agent-name"></span>
      </div>
      <div id="terminal-container"></div>
      <div id="key-toolbar">
        <button id="ctrl-key" onclick="toggleCtrl()">Ctrl</button>
        <button onclick="sendKey('\x1b')">Esc</button>
        <button onclick="sendKey('\t')">Tab</button>
        <div class="divider"></div>
        <button onclick="sendKey('\x1b[A')">↑</button>
        <button onclick="sendKey('\x1b[B')">↓</button>
        <button onclick="sendKey('\x1b[D')">←</button>
        <button onclick="sendKey('\x1b[C')">→</button>
        <div class="divider"></div>
        <button onclick="sendKey('\x1b[H')">Home</button>
        <button onclick="sendKey('\x1b[F')">End</button>
        <button onclick="sendKey('\x1b[5~')">PgUp</button>
        <button onclick="sendKey('\x1b[6~')">PgDn</button>
        <div class="divider"></div>
        <button onclick="sendKey('\x03')">^C</button>
        <button onclick="sendKey('\x04')">^D</button>
        <button onclick="sendKey('\x1a')">^Z</button>
        <button onclick="sendKey('\x0c')">^L</button>
        <button onclick="sendKey('\x12')">^R</button>
        <button onclick="sendKey('\x15')">^U</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.min.js"></script>

  <script>
    // ── State ──
    let currentWs = null;
    let currentTerm = null;
    let fitAddon = null;
    let ctrlArmed = false;

    // ── Key Toolbar ──
    function sendKey(seq) {
      if (currentWs && currentWs.readyState === WebSocket.OPEN) {
        currentWs.send(JSON.stringify({ type: 'input', data: seq }));
      }
      if (currentTerm) currentTerm.focus();
    }

    function setCtrlArmed(state) {
      ctrlArmed = state;
      const btn = document.getElementById('ctrl-key');
      if (btn) btn.classList.toggle('active', ctrlArmed);
    }

    function toggleCtrl() {
      setCtrlArmed(!ctrlArmed);
      if (currentTerm) currentTerm.focus();
    }

    function toCtrlCode(ch) {
      const code = ch.toUpperCase().charCodeAt(0);
      if (code >= 64 && code <= 95) {
        return String.fromCharCode(code - 64);
      }
      return ch;
    }

    // ── Mobile keyboard detection ──
    // When the OS keyboard appears, visualViewport shrinks. We lift the toolbar
    // above it so the buttons stay tappable.
    function updateToolbarForKeyboard() {
      const toolbar = document.getElementById('key-toolbar');
      if (!toolbar) return;

      let keyboardHeight = 0;
      if (window.visualViewport) {
        // Difference between layout viewport and visual viewport = keyboard height
        keyboardHeight = Math.max(0, window.innerHeight - window.visualViewport.height - window.visualViewport.offsetTop);
      }

      if (keyboardHeight > 100) {
        // Keyboard is open — shift toolbar up
        toolbar.style.transform = `translateY(-${keyboardHeight}px)`;
      } else {
        toolbar.style.transform = 'translateY(0)';
      }

      // Also keep terminal bottom edge above the keyboard
      if (fitAddon) fitAddon.fit();
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', updateToolbarForKeyboard);
      window.visualViewport.addEventListener('scroll', updateToolbarForKeyboard);
    }
    window.addEventListener('resize', updateToolbarForKeyboard);

    // ── Login ──
    async function doLogin() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('login-error');
      errEl.style.display = 'none';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) {
          errEl.textContent = data.error || 'Login failed';
          errEl.style.display = 'block';
          return;
        }
        showDashboard();
      } catch (e) {
        errEl.textContent = 'Connection error';
        errEl.style.display = 'block';
      }
    }

    // Enter key on password field
    document.getElementById('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doLogin();
    });

    async function doLogout() {
      await fetch('/api/logout', { method: 'POST' });
      closeTerminal();
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
    }

    // ── Dashboard ──
    function showDashboard() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'flex';
      refreshAgents();
    }

    async function refreshAgents() {
      const listEl = document.getElementById('agent-list');
      try {
        const res = await fetch('/api/agents');
        if (res.status === 401) { doLogout(); return; }
        const data = await res.json();
        if (data.agents.length === 0) {
          listEl.innerHTML = '<div class="no-agents">No agents online</div>';
          return;
        }
        listEl.innerHTML = data.agents.map(a => `
          <div class="agent-card" onclick="openTerminal('${a.id}', '${a.name}')">
            <div class="agent-info">
              <div class="agent-dot"></div>
              <div>
                <div class="agent-name">${escHtml(a.name)}</div>
                <div class="agent-id">${escHtml(a.id)}</div>
              </div>
            </div>
            <div class="agent-meta">${a.activeSessions} session(s)</div>
          </div>
        `).join('');
      } catch (e) {
        listEl.innerHTML = '<div class="no-agents">Error loading agents</div>';
      }
    }

    // Auto-refresh every 5s
    setInterval(() => {
      if (document.getElementById('agent-list-view').style.display !== 'none') {
        refreshAgents();
      }
    }, 5000);

    // ── Terminal ──
    function openTerminal(agentId, agentName) {
      document.getElementById('agent-list-view').style.display = 'none';
      document.getElementById('terminal-view').style.display = 'flex';
      document.getElementById('terminal-agent-name').textContent = `${agentName} (${agentId})`;

      // Create xterm instance
      currentTerm = new Terminal({
        cursorBlink: true,
        fontSize: 14,
        fontFamily: "'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace",
        theme: {
          background: '#1a1b26',
          foreground: '#c0caf5',
          cursor: '#c0caf5',
          selectionBackground: '#33467c',
          black: '#15161e', red: '#f7768e', green: '#9ece6a', yellow: '#e0af68',
          blue: '#7aa2f7', magenta: '#bb9af7', cyan: '#7dcfff', white: '#a9b1d6',
          brightBlack: '#414868', brightRed: '#f7768e', brightGreen: '#9ece6a',
          brightYellow: '#e0af68', brightBlue: '#7aa2f7', brightMagenta: '#bb9af7',
          brightCyan: '#7dcfff', brightWhite: '#c0caf5'
        }
      });

      fitAddon = new FitAddon.FitAddon();
      currentTerm.loadAddon(fitAddon);
      currentTerm.loadAddon(new WebLinksAddon.WebLinksAddon());

      const container = document.getElementById('terminal-container');
      container.innerHTML = '';
      currentTerm.open(container);
      fitAddon.fit();

      // Connect WebSocket
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      currentWs = new WebSocket(`${proto}//${location.host}/ws/terminal?agentId=${agentId}`);

      currentWs.onopen = () => {
        currentTerm.writeln('\x1b[32m● Connected to agent\x1b[0m\r');
        // Send initial terminal size
        currentWs.send(JSON.stringify({
          type: 'resize',
          cols: currentTerm.cols,
          rows: currentTerm.rows
        }));
      };

      currentWs.onmessage = (evt) => {
        try {
          const msg = JSON.parse(evt.data);
          if (msg.type === 'output') {
            currentTerm.write(msg.data);
          } else if (msg.type === 'exit') {
            currentTerm.writeln('\r\n\x1b[31m● Shell exited\x1b[0m');
          } else if (msg.type === 'agent-disconnected') {
            currentTerm.writeln('\r\n\x1b[31m● Agent disconnected\x1b[0m');
          }
        } catch {}
      };

      currentWs.onclose = () => {
        currentTerm.writeln('\r\n\x1b[33m● Connection closed\x1b[0m');
      };

      currentWs.onerror = () => {
        currentTerm.writeln('\r\n\x1b[31m● Connection error\x1b[0m');
      };

      // Send keystrokes
      currentTerm.onData((data) => {
        if (ctrlArmed && data.length === 1) {
          data = toCtrlCode(data);
          setCtrlArmed(false);
        }
        if (currentWs && currentWs.readyState === WebSocket.OPEN) {
          currentWs.send(JSON.stringify({ type: 'input', data }));
        }
      });

      // Handle resize
      currentTerm.onResize(({ cols, rows }) => {
        if (currentWs && currentWs.readyState === WebSocket.OPEN) {
          currentWs.send(JSON.stringify({ type: 'resize', cols, rows }));
        }
      });

      window.addEventListener('resize', () => { if (fitAddon) fitAddon.fit(); });
    }

    function closeTerminal() {
      if (currentWs) { currentWs.close(); currentWs = null; }
      if (currentTerm) { currentTerm.dispose(); currentTerm = null; }
      fitAddon = null;
      setCtrlArmed(false);
    }

    function backToList() {
      closeTerminal();
      document.getElementById('terminal-view').style.display = 'none';
      document.getElementById('agent-list-view').style.display = 'block';
      refreshAgents();
    }

    // ── Check if already logged in ──
    (async () => {
      try {
        const res = await fetch('/api/agents');
        if (res.ok) showDashboard();
      } catch {}
    })();

    function escHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }
  </script>
</body>
</html>
