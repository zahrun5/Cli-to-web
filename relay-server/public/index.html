<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, interactive-widget=resizes-content">
  <title>CLI-to-Web Terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { height: 100%; overscroll-behavior: none; }

    /* Body dikunci ke area yang benar-benar kelihatan (di atas keyboard HP).
       Tinggi & posisinya di-update JS dari visualViewport. */
    body {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      display: flex;
      flex-direction: column;
      background: #1a1b26;
      color: #c0caf5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* ── Login ── */
    #login-screen { display: flex; align-items: center; justify-content: center; flex: 1; min-height: 0; }
    .login-box { background: #24283b; border: 1px solid #3b4261; border-radius: 12px; padding: 2rem; width: min(360px, 92vw); }
    .login-box h1 { font-size: 1.4rem; margin-bottom: 0.5rem; color: #7aa2f7; }
    .login-box p { font-size: 0.85rem; color: #565f89; margin-bottom: 1.5rem; }
    .login-box input { width: 100%; padding: 0.6rem 0.8rem; background: #1a1b26; border: 1px solid #3b4261; border-radius: 6px; color: #c0caf5; font-size: 0.9rem; margin-bottom: 0.8rem; outline: none; }
    .login-box input:focus { border-color: #7aa2f7; }
    .login-box button { width: 100%; padding: 0.6rem; background: #7aa2f7; color: #1a1b26; border: none; border-radius: 6px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
    .login-box button:hover { background: #89b4fa; }
    .login-error { color: #f7768e; font-size: 0.8rem; margin-bottom: 0.5rem; display: none; }

    /* ── Dashboard ── */
    #dashboard { display: none; flex-direction: column; flex: 1; min-height: 0; }
    /* Pas di mode terminal, topbar dashboard disembunyikan biar ruang layar lebih lega */
    #dashboard.in-terminal > .topbar { display: none; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 0.8rem 1.2rem; background: #24283b; border-bottom: 1px solid #3b4261; flex-shrink: 0; }
    .topbar h2 { font-size: 1rem; color: #7aa2f7; }
    .topbar button { background: none; border: 1px solid #3b4261; color: #565f89; padding: 0.3rem 0.8rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
    .topbar button:hover { color: #c0caf5; border-color: #565f89; }

    /* ── Agent List ── */
    #agent-list-view { flex: 1; min-height: 0; padding: 1.5rem; overflow-y: auto; }
    #agent-list-view h3 { color: #565f89; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 1rem; }
    .agent-card { background: #24283b; border: 1px solid #3b4261; border-radius: 8px; padding: 1rem 1.2rem; margin-bottom: 0.6rem; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: border-color 0.15s; }
    .agent-card:hover { border-color: #7aa2f7; }
    .agent-info { display: flex; align-items: center; gap: 0.8rem; }
    .agent-dot { width: 8px; height: 8px; border-radius: 50%; background: #9ece6a; }
    .agent-name { font-weight: 600; font-size: 0.95rem; }
    .agent-id { color: #565f89; font-size: 0.75rem; font-family: monospace; }
    .agent-meta { color: #565f89; font-size: 0.8rem; }
    .no-agents { color: #565f89; text-align: center; padding: 3rem; }

    /* ── Terminal ── */
    #terminal-view { display: none; flex: 1; min-height: 0; flex-direction: column; }
    .terminal-topbar { display: flex; align-items: center; gap: 0.8rem; padding: 0.5rem 1rem; background: #24283b; border-bottom: 1px solid #3b4261; flex-shrink: 0; }
    .terminal-topbar button { background: none; border: 1px solid #3b4261; color: #c0caf5; padding: 0.25rem 0.6rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
    .terminal-topbar button:hover { border-color: #7aa2f7; color: #7aa2f7; }
    .terminal-topbar span { font-family: monospace; font-size: 0.85rem; color: #9ece6a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Area terminal makan semua sisa ruang; touch-action none = scroll disetir JS (ada inertia) */
    #terminal-container {
      flex: 1 1 0;
      min-height: 0;
      padding: 4px;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    /* Kotak input tersembunyi milik xterm tetap boleh menerima ketikan */
    #terminal-container .xterm-helper-textarea { -webkit-user-select: text; user-select: text; }

    /* Toast kecil (mis. "Tersalin") */
    #toast {
      position: absolute;
      left: 50%;
      bottom: 72px;
      transform: translateX(-50%);
      background: #33467c;
      color: #c0caf5;
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      font-size: 0.8rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
      z-index: 10;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    /* ── Key Toolbar ── (ikut alur layout, bukan fixed → tidak pernah nutupin terminal) */
    #key-toolbar {
      flex-shrink: 0;
      display: flex;
      gap: 6px;
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
      background: #24283b;
      border-top: 1px solid #3b4261;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    #key-toolbar::-webkit-scrollbar { display: none; }
    #key-toolbar button {
      flex-shrink: 0;
      min-width: 42px;
      padding: 0.5rem 0.7rem;
      background: #1a1b26;
      border: 1px solid #3b4261;
      color: #c0caf5;
      border-radius: 6px;
      font-size: 0.85rem;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    #key-toolbar button:active { background: #33467c; }
    #key-toolbar button.active {
      background: #7aa2f7;
      color: #1a1b26;
      border-color: #7aa2f7;
    }
    #key-toolbar .divider {
      width: 1px;
      flex-shrink: 0;
      background: #3b4261;
      margin: 2px 2px;
    }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div id="login-screen">
    <div class="login-box">
      <h1>🖥 CLI-to-Web</h1>
      <p>Terminal akses jarak jauh</p>
      <div id="login-error" class="login-error"></div>
      <input type="text" id="username" placeholder="Username" autocomplete="username">
      <input type="password" id="password" placeholder="Password" autocomplete="current-password">
      <button id="login-btn" onclick="doLogin()">Login</button>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard">
    <div class="topbar">
      <h2>🖥 CLI-to-Web</h2>
      <div style="display:flex;gap:0.5rem;">
        <button onclick="refreshAgents()">↻ Refresh</button>
        <button onclick="doLogout()">Logout</button>
      </div>
    </div>

    <!-- Agent List -->
    <div id="agent-list-view">
      <h3>Online Agents</h3>
      <div id="agent-list"></div>
    </div>

    <!-- Terminal -->
    <div id="terminal-view">
      <div class="terminal-topbar">
        <button onclick="backToList()">← Back</button>
        <span id="terminal-agent-name"></span>
      </div>
      <div id="terminal-container"></div>
      <div id="key-toolbar">
        <button id="copy-key" onclick="copySelection()">Copy</button>
        <div class="divider"></div>
        <button id="ctrl-key" onclick="toggleCtrl()">Ctrl</button>
        <button onclick="sendKey('\x1b')">Esc</button>
        <button onclick="sendKey('\t')">Tab</button>
        <div class="divider"></div>
        <button onclick="sendKey('\x1b[A')">↑</button>
        <button onclick="sendKey('\x1b[B')">↓</button>
        <button onclick="sendKey('\x1b[D')">←</button>
        <button onclick="sendKey('\x1b[C')">→</button>
        <div class="divider"></div>
        <button onclick="sendKey('\x1b[H')">Home</button>
        <button onclick="sendKey('\x1b[F')">End</button>
        <button onclick="sendKey('\x1b[5~')">PgUp</button>
        <button onclick="sendKey('\x1b[6~')">PgDn</button>
        <div class="divider"></div>
        <button onclick="sendKey('\x03')">^C</button>
        <button onclick="sendKey('\x04')">^D</button>
        <button onclick="sendKey('\x1a')">^Z</button>
        <button onclick="sendKey('\x0c')">^L</button>
        <button onclick="sendKey('\x12')">^R</button>
        <button onclick="sendKey('\x15')">^U</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.min.js"></script>

  <script>
    // ── State ──
    let currentWs = null;
    let currentTerm = null;
    let fitAddon = null;
    let ctrlArmed = false;
    let resizeObserver = null;
    let detachTouch = null;

    // ── Kirim input ke shell ──
    function sendInput(data) {
      if (currentWs && currentWs.readyState === WebSocket.OPEN) {
        currentWs.send(JSON.stringify({ type: 'input', data }));
      }
    }

    // ── Key Toolbar ──
    function sendKey(seq) {
      sendInput(seq);
      if (currentTerm) currentTerm.focus();
    }

    function setCtrlArmed(state) {
      ctrlArmed = state;
      const btn = document.getElementById('ctrl-key');
      if (btn) btn.classList.toggle('active', ctrlArmed);
    }

    function toggleCtrl() {
      setCtrlArmed(!ctrlArmed);
      if (currentTerm) currentTerm.focus();
    }

    function toCtrlCode(ch) {
      const code = ch.toUpperCase().charCodeAt(0);
      if (code >= 64 && code <= 95) {
        return String.fromCharCode(code - 64);
      }
      return ch;
    }

    // Tap tombol toolbar jangan sampai ngerebut fokus dari terminal,
    // kalau tidak keyboard HP nutup-buka sendiri.
    document.getElementById('key-toolbar').addEventListener('mousedown', (e) => e.preventDefault());

    // ── Layout mengikuti area yang kelihatan (keyboard HP) ──
    let fitRaf = 0;
    function scheduleFit() {
      if (fitRaf) return;
      fitRaf = requestAnimationFrame(() => {
        fitRaf = 0;
        if (!fitAddon || !currentTerm) return;
        const c = document.getElementById('terminal-container');
        if (!c || !c.clientHeight) return;
        const buf = currentTerm.buffer.active;
        const atBottom = buf.viewportY >= buf.baseY;
        try { fitAddon.fit(); } catch {}
        // Kalau tadinya di paling bawah, tetap di bawah supaya baris input kelihatan
        if (atBottom) currentTerm.scrollToBottom();
      });
    }

    function syncViewport() {
      const vv = window.visualViewport;
      if (vv && Math.abs(vv.scale - 1) < 0.01) {
        document.body.style.height = vv.height + 'px';
        document.body.style.top = vv.offsetTop + 'px';
      }
      scheduleFit();
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', syncViewport);
      window.visualViewport.addEventListener('scroll', syncViewport);
    }
    window.addEventListener('resize', syncViewport);
    window.addEventListener('orientationchange', syncViewport);
    syncViewport();

    // ── Toast & Copy ──
    let toastTimer = 0;
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 1400);
    }

    async function copyText(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch {}
      // Cadangan kalau Clipboard API ditolak
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.readOnly = true;
        ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        const ok = document.execCommand('copy');
        ta.remove();
        return ok;
      } catch {
        return false;
      }
    }

    async function copySelection() {
      if (!currentTerm || !currentTerm.hasSelection()) {
        showToast('Belum ada teks yang dipilih');
        return;
      }
      const ok = await copyText(currentTerm.getSelection());
      if (ok) {
        currentTerm.clearSelection();
        showToast('Tersalin ✓');
      } else {
        showToast('Gagal menyalin');
      }
    }

    // ── Sentuh: scroll (inertia) + pilih teks (tahan lama lalu geser) ──
    function attachTouchScroll(term, container) {
      const SLOP = 8;             // px, batas antara "tap/tahan" dan "geser"
      const LONG_PRESS_MS = 450;  // tahan selama ini → mulai pilih teks
      const EDGE = 36;            // px dari tepi atas/bawah → auto-scroll saat memilih
      const st = {
        active: false, moved: false, selecting: false,
        startX: 0, startY: 0, lastY: 0, curX: 0, curY: 0, lastT: 0,
        v: 0, acc: 0, raf: 0,
        pressTimer: 0, selRaf: 0, lastAuto: 0,
        anchorS: 0, anchorE: 0, blockMouseUntil: 0
      };

      function screenRect() {
        const screen = container.querySelector('.xterm-screen');
        return screen ? screen.getBoundingClientRect() : container.getBoundingClientRect();
      }

      function lineHeight() {
        const r = screenRect();
        return (r.height && term.rows) ? r.height / term.rows : 17;
      }

      // ── scroll ──
      function scrollByPixels(dy) {
        st.acc += -dy / lineHeight();
        const n = Math.trunc(st.acc);
        if (!n) return;
        st.acc -= n;
        if (term.buffer.active.type === 'alternate') {
          // Aplikasi layar penuh (vim, htop, less): terjemahkan ke tombol panah
          const app = term.modes && term.modes.applicationCursorKeysMode;
          const seq = n > 0 ? (app ? '\x1bOB' : '\x1b[B') : (app ? '\x1bOA' : '\x1b[A');
          sendInput(seq.repeat(Math.min(Math.abs(n), 5)));
        } else {
          term.scrollLines(n);
        }
      }

      function stopFling() {
        if (st.raf) { cancelAnimationFrame(st.raf); st.raf = 0; }
      }

      // ── seleksi ──
      function cellAt(x, y) {
        const r = screenRect();
        const cw = r.width / term.cols;
        const ch = r.height / term.rows;
        const col = Math.min(term.cols - 1, Math.max(0, Math.floor((x - r.left) / cw)));
        const row = Math.min(term.rows - 1, Math.max(0, Math.floor((y - r.top) / ch)));
        return { col, row: row + term.buffer.active.viewportY };
      }

      function linOf(cell) { return cell.row * term.cols + cell.col; }

      // Kata = deretan karakter non-spasi (cocok untuk path, URL, perintah)
      function wordBounds(cell) {
        const lin = linOf(cell);
        const line = term.buffer.active.getLine(cell.row);
        if (!line) return { s: lin, e: lin };
        const text = line.translateToString(false);
        const isSp = (i) => { const ch = text[i]; return !ch || ch === ' '; };
        if (isSp(cell.col)) return { s: lin, e: lin };
        let a = cell.col, b = cell.col;
        while (a > 0 && !isSp(a - 1)) a--;
        while (b < text.length - 1 && !isSp(b + 1)) b++;
        return { s: cell.row * term.cols + a, e: cell.row * term.cols + b };
      }

      function applySelection() {
        const c = linOf(cellAt(st.curX, st.curY));
        let s, e;
        if (c >= st.anchorS) { s = st.anchorS; e = Math.max(c, st.anchorE); }
        else { s = c; e = st.anchorE; }
        term.select(s % term.cols, Math.floor(s / term.cols), e - s + 1);
      }

      // Auto-scroll kalau jari dekat tepi atas/bawah saat memilih (untuk output panjang)
      function selTick(now) {
        if (!st.selecting) { st.selRaf = 0; return; }
        const r = container.getBoundingClientRect();
        let dir = 0;
        if (st.curY < r.top + EDGE) dir = -1;
        else if (st.curY > r.bottom - EDGE) dir = 1;
        if (dir && now - st.lastAuto > 60) {
          st.lastAuto = now;
          term.scrollLines(dir);
          applySelection();
        }
        st.selRaf = requestAnimationFrame(selTick);
      }

      function cancelPress() {
        if (st.pressTimer) { clearTimeout(st.pressTimer); st.pressTimer = 0; }
      }

      function beginSelect() {
        st.pressTimer = 0;
        if (!st.active || st.moved) return;
        st.selecting = true;
        const w = wordBounds(cellAt(st.curX, st.curY));
        st.anchorS = w.s;
        st.anchorE = w.e;
        applySelection();
        if (navigator.vibrate) navigator.vibrate(15);
        st.selRaf = requestAnimationFrame(selTick);
      }

      // ── event sentuh ──
      function onStart(e) {
        if (e.touches.length !== 1) { cancelPress(); st.active = false; return; }
        e.stopPropagation();
        stopFling();
        const t = e.touches[0];
        st.active = true;
        st.moved = false;
        st.selecting = false;
        st.startX = st.curX = t.clientX;
        st.startY = st.lastY = st.curY = t.clientY;
        st.lastT = performance.now();
        st.v = 0;
        st.acc = 0;
        cancelPress();
        st.pressTimer = setTimeout(beginSelect, LONG_PRESS_MS);
      }

      function onMove(e) {
        if (!st.active) return;
        if (e.touches.length !== 1) { cancelPress(); st.active = false; return; }
        e.stopPropagation();
        e.preventDefault();
        const t = e.touches[0];
        st.curX = t.clientX;
        st.curY = t.clientY;

        if (st.selecting) { applySelection(); return; }

        if (!st.moved &&
            Math.abs(t.clientY - st.startY) < SLOP &&
            Math.abs(t.clientX - st.startX) < SLOP) return; // masih tap/tahan

        cancelPress();
        st.moved = true;
        const now = performance.now();
        const dy = t.clientY - st.lastY;
        const dt = Math.max(1, now - st.lastT);
        st.v = 0.7 * st.v + 0.3 * (dy / dt);
        st.lastY = t.clientY;
        st.lastT = now;
        scrollByPixels(dy);
      }

      function onEnd(e) {
        if (!st.active) return;
        e.stopPropagation();
        cancelPress();
        st.active = false;

        if (st.selecting) {
          st.selecting = false;
          if (st.selRaf) { cancelAnimationFrame(st.selRaf); st.selRaf = 0; }
          // Cegah event mouse "susulan" dari browser menghapus seleksi
          st.blockMouseUntil = performance.now() + 700;
          return;
        }

        if (!st.moved) {
          // Tap biasa: hapus seleksi kalau ada
          if (term.hasSelection()) term.clearSelection();
          return;
        }

        if (performance.now() - st.lastT > 80) return; // jari berhenti dulu → tanpa fling
        let last = performance.now();
        const tick = (now) => {
          const dt = now - last;
          last = now;
          scrollByPixels(st.v * dt);
          st.v *= Math.pow(0.996, dt);
          st.raf = Math.abs(st.v) > 0.02 ? requestAnimationFrame(tick) : 0;
        };
        st.raf = requestAnimationFrame(tick);
      }

      // Event mouse sintetis setelah tahan-lama tidak boleh sampai ke xterm
      const guard = (e) => {
        if (performance.now() < st.blockMouseUntil) {
          e.stopPropagation();
          e.preventDefault();
        }
      };
      const onCtx = (e) => e.preventDefault();       // matikan menu tahan-lama bawaan Android
      const onClick = () => {                        // tap = munculkan keyboard
        if (performance.now() < st.blockMouseUntil) return;
        term.focus();
      };

      const cap = { capture: true };
      container.addEventListener('touchstart', onStart, { capture: true, passive: true });
      container.addEventListener('touchmove', onMove, { capture: true, passive: false });
      container.addEventListener('touchend', onEnd, { capture: true, passive: true });
      container.addEventListener('touchcancel', onEnd, { capture: true, passive: true });
      ['mousedown', 'mouseup', 'click'].forEach(t => container.addEventListener(t, guard, cap));
      container.addEventListener('contextmenu', onCtx);
      container.addEventListener('click', onClick);

      return () => {
        stopFling();
        cancelPress();
        if (st.selRaf) { cancelAnimationFrame(st.selRaf); st.selRaf = 0; }
        container.removeEventListener('touchstart', onStart, cap);
        container.removeEventListener('touchmove', onMove, cap);
        container.removeEventListener('touchend', onEnd, cap);
        container.removeEventListener('touchcancel', onEnd, cap);
        ['mousedown', 'mouseup', 'click'].forEach(t => container.removeEventListener(t, guard, cap));
        container.removeEventListener('contextmenu', onCtx);
        container.removeEventListener('click', onClick);
      };
    }

    // ── Login ──
    async function doLogin() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('login-error');
      errEl.style.display = 'none';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) {
          errEl.textContent = data.error || 'Login failed';
          errEl.style.display = 'block';
          return;
        }
        showDashboard();
      } catch (e) {
        errEl.textContent = 'Connection error';
        errEl.style.display = 'block';
      }
    }

    // Enter key on password field
    document.getElementById('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doLogin();
    });

    async function doLogout() {
      await fetch('/api/logout', { method: 'POST' });
      closeTerminal();
      document.getElementById('terminal-view').style.display = 'none';
      document.getElementById('agent-list-view').style.display = 'block';
      document.getElementById('dashboard').classList.remove('in-terminal');
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
    }

    // ── Dashboard ──
    function showDashboard() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'flex';
      refreshAgents();
    }

    async function refreshAgents() {
      const listEl = document.getElementById('agent-list');
      try {
        const res = await fetch('/api/agents');
        if (res.status === 401) { doLogout(); return; }
        const data = await res.json();
        if (data.agents.length === 0) {
          listEl.innerHTML = '<div class="no-agents">No agents online</div>';
          return;
        }
        listEl.innerHTML = data.agents.map(a => `
          <div class="agent-card" onclick="openTerminal('${a.id}', '${a.name}')">
            <div class="agent-info">
              <div class="agent-dot"></div>
              <div>
                <div class="agent-name">${escHtml(a.name)}</div>
                <div class="agent-id">${escHtml(a.id)}</div>
              </div>
            </div>
            <div class="agent-meta">${a.activeSessions} session(s)</div>
          </div>
        `).join('');
      } catch (e) {
        listEl.innerHTML = '<div class="no-agents">Error loading agents</div>';
      }
    }

    // Auto-refresh every 5s
    setInterval(() => {
      if (document.getElementById('agent-list-view').style.display !== 'none') {
        refreshAgents();
      }
    }, 5000);

    // ── Terminal ──
    function openTerminal(agentId, agentName) {
      closeTerminal(); // pastikan sisa sesi lama bersih

      document.getElementById('agent-list-view').style.display = 'none';
      document.getElementById('terminal-view').style.display = 'flex';
      document.getElementById('dashboard').classList.add('in-terminal');
      document.getElementById('terminal-agent-name').textContent = `${agentName} (${agentId})`;

      // Create xterm instance
      currentTerm = new Terminal({
        cursorBlink: true,
        fontSize: 14,
        scrollback: 5000,
        smoothScrollDuration: 0,
        fontFamily: "'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace",
        theme: {
          background: '#1a1b26',
          foreground: '#c0caf5',
          cursor: '#c0caf5',
          selectionBackground: '#33467c',
          selectionInactiveBackground: '#33467c',
          black: '#15161e', red: '#f7768e', green: '#9ece6a', yellow: '#e0af68',
          blue: '#7aa2f7', magenta: '#bb9af7', cyan: '#7dcfff', white: '#a9b1d6',
          brightBlack: '#414868', brightRed: '#f7768e', brightGreen: '#9ece6a',
          brightYellow: '#e0af68', brightBlue: '#7aa2f7', brightMagenta: '#bb9af7',
          brightCyan: '#7dcfff', brightWhite: '#c0caf5'
        }
      });

      fitAddon = new FitAddon.FitAddon();
      currentTerm.loadAddon(fitAddon);
      currentTerm.loadAddon(new WebLinksAddon.WebLinksAddon());

      const container = document.getElementById('terminal-container');
      container.innerHTML = '';
      currentTerm.open(container);
      fitAddon.fit();

      // Scroll sentuh + pilih teks + tap-to-focus
      detachTouch = attachTouchScroll(currentTerm, container);

      // Tombol Copy menyala kalau ada teks terpilih
      currentTerm.onSelectionChange(() => {
        const b = document.getElementById('copy-key');
        if (b && currentTerm) b.classList.toggle('active', currentTerm.hasSelection());
      });

      // Setiap ukuran area terminal berubah (keyboard, toolbar, rotasi) → fit ulang
      resizeObserver = new ResizeObserver(() => scheduleFit());
      resizeObserver.observe(container);

      // Connect WebSocket
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${proto}//${location.host}/ws/terminal?agentId=${agentId}`);
      currentWs = ws;
      const term = currentTerm;

      ws.onopen = () => {
        term.writeln('\x1b[32m● Connected to agent\x1b[0m\r');
        // Send initial terminal size
        ws.send(JSON.stringify({
          type: 'resize',
          cols: term.cols,
          rows: term.rows
        }));
      };

      ws.onmessage = (evt) => {
        try {
          const msg = JSON.parse(evt.data);
          if (msg.type === 'output') {
            term.write(msg.data);
          } else if (msg.type === 'exit') {
            term.writeln('\r\n\x1b[31m● Shell exited\x1b[0m');
          } else if (msg.type === 'agent-disconnected') {
            term.writeln('\r\n\x1b[31m● Agent disconnected\x1b[0m');
          }
        } catch {}
      };

      ws.onclose = () => {
        term.writeln('\r\n\x1b[33m● Connection closed\x1b[0m');
      };

      ws.onerror = () => {
        term.writeln('\r\n\x1b[31m● Connection error\x1b[0m');
      };

      // Send keystrokes
      term.onData((data) => {
        if (ctrlArmed && data.length === 1) {
          data = toCtrlCode(data);
          setCtrlArmed(false);
        }
        sendInput(data);
      });

      // Handle resize
      term.onResize(({ cols, rows }) => {
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'resize', cols, rows }));
        }
      });

      scheduleFit();
    }

    function closeTerminal() {
      if (detachTouch) { detachTouch(); detachTouch = null; }
      if (resizeObserver) { resizeObserver.disconnect(); resizeObserver = null; }
      if (currentWs) { currentWs.close(); currentWs = null; }
      if (currentTerm) { currentTerm.dispose(); currentTerm = null; }
      fitAddon = null;
      setCtrlArmed(false);
      const cb = document.getElementById('copy-key');
      if (cb) cb.classList.remove('active');
    }

    function backToList() {
      closeTerminal();
      document.getElementById('terminal-view').style.display = 'none';
      document.getElementById('dashboard').classList.remove('in-terminal');
      document.getElementById('agent-list-view').style.display = 'block';
      refreshAgents();
    }

    // ── Check if already logged in ──
    (async () => {
      try {
        const res = await fetch('/api/agents');
        if (res.ok) showDashboard();
      } catch {}
    })();

    function escHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }
  </script>
</body>
</html>
